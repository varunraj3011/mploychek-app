<div class="admin-wrapper">

  <div class="top-bar">
    <h2>MPloyChek — Admin Panel</h2>
    <div>
      <button (click)="router.navigate(['/dashboard'])">Dashboard</button>
      <button (click)="logout()">Logout</button>
    </div>
  </div>

  <!-- Add User Form -->
  <div class="section">
    <h4>Add New User</h4>
    <div class="add-form">
      <input placeholder="User ID" [(ngModel)]="newUser.userid" />
      <input placeholder="Password" [(ngModel)]="newUser.password" />
      <select [(ngModel)]="newUser.role">
        <option>General User</option>
        <option>Admin</option>
      </select>
      <button (click)="addUser()">Add User</button>
    </div>
  </div>

  <!-- Users Table -->
  <div class="section">
    <h4>Manage Users</h4>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>User ID</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.userid }}</td>
          <td>{{ user.role }}</td>
          <td>
            <button class="delete-btn" (click)="deleteUser(user.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
